[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tidest"
version = "0.1.0"
description = "Testing Imputed Differential Expressions for Spatial Transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lorenzo Testa" },
]
keywords = [
    "spatial transcriptomics",
    "differential expression",
    "causal inference",
    "partially linear model",
    "imputation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "statsmodels>=0.13",
    "anndata>=0.8",
    "scanpy>=1.9",
    "pyarrow>=10.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/testalorenzo/tidest"
Repository = "https://github.com/testalorenzo/tidest"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
tidest = ["R/*.R"]
